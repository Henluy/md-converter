name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Détecte ce qui a changé pour ne pas tout faire tourner pour rien.
  # -------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            api:
              - 'apps/api/**'
            workflows:
              - '.github/workflows/**'

  # -------------------------------------------------------------------------
  # Lint global du repo (yaml, markdown, secrets) — toujours actif.
  # -------------------------------------------------------------------------
  repo-lint:
    name: Repo lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .env is not committed
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.local$|^\.env\.[^.]+\.local$' ; then
            echo "❌ Un fichier .env est tracké."
            exit 1
          fi

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet

      - name: Check secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # -------------------------------------------------------------------------
  # Web (Next.js) — pnpm workspace install from repo root, then per-app checks.
  # -------------------------------------------------------------------------
  web:
    name: Web (Next.js)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Type-check
        working-directory: apps/web
        run: pnpm type-check

      - name: Test
        working-directory: apps/web
        run: pnpm test

      - name: Build (production smoke)
        working-directory: apps/web
        run: pnpm build

      - name: Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # -------------------------------------------------------------------------
  # API (FastAPI) — actif quand apps/api/pyproject.toml existe.
  # -------------------------------------------------------------------------
  api:
    name: API (FastAPI)
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/md_converter_ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: md_converter_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (pandoc, libmagic)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc libmagic1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"
          enable-cache: true
          cache-dependency-glob: 'apps/api/uv.lock'

      - name: Set up Python
        run: uv python install 3.11.15

      - name: Install deps
        run: uv sync --frozen --all-extras

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply Drizzle migrations
        working-directory: ${{ github.workspace }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @md/web db:migrate

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy app

      - name: Test (pytest)
        run: uv run pytest

      - name: Audit (pip-audit)
        run: uv run pip-audit
        continue-on-error: true

  # -------------------------------------------------------------------------
  # Statut agrégé — utile pour la branch protection rule.
  # Fail loud if ANY upstream is non-success (including changes detection).
  # -------------------------------------------------------------------------
  ci-success:
    name: CI success
    needs: [changes, repo-lint, web, api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          fail=0
          for job in changes repo-lint web api; do
            case "$job" in
              changes)   result="${{ needs.changes.result }}"   ;;
              repo-lint) result="${{ needs.repo-lint.result }}" ;;
              web)       result="${{ needs.web.result }}"       ;;
              api)       result="${{ needs.api.result }}"       ;;
            esac
            # "skipped" is acceptable for web/api (no changes detected).
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ $job ended in $result"
              fail=1
            fi
          done
          if [[ "$fail" -eq 1 ]]; then exit 1; fi
          echo "✔ CI green."
