# docker-compose.yml — md-converter local dev stack
#
# Postgres reste hors-container (déjà installé sur la machine hôte, port 5432).
# Services containerisés : redis, api, worker, web.
#
# Les services `api`, `worker`, `web` restent commentés tant que leurs
# Dockerfiles n'existent pas (tickets 4, 6, 11 du plan d'attaque).
# Redis est utilisable dès maintenant : `docker compose up redis`.

name: md-converter

services:
  redis:
    image: redis:7.4-alpine
    container_name: md-converter-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

